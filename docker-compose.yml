version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: studenthub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: studenthub_user
      POSTGRES_PASSWORD: studenthub_secret_pass
      POSTGRES_DB: studenthub_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U studenthub_user -d studenthub_db']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studenthub_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api/v1
      DATABASE_URL: 'postgresql://studenthub_user:studenthub_secret_pass@postgres:5432/studenthub_db?schema=public'
      JWT_ACCESS_SECRET: studenthub_super_secret_jwt_access_key_change_in_production_min_64_chars!
      JWT_REFRESH_SECRET: studenthub_super_secret_jwt_refresh_key_change_in_production_min_64_chars!
      JWT_ACCESS_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
      ALLOWED_ORIGINS: '*'
      THROTTLE_TTL: 60000
      THROTTLE_LIMIT: 100

volumes:
  postgres_data:
    driver: local
